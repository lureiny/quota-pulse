name: quota_pulse
description: "sub2api 用量脉搏 — macOS 菜单栏预览栏"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  quota_pulse_ui:         # 共享层:模型 / UI / 状态 / 桌面 FFI 桥
    path: ../../ui
  # macOS 菜单栏状态项改为自管 Swift(runner_patches/AppDelegate.swift),
  # 支持固定图标 + 像素级流水屏滚动,故不再用 tray_manager。
  window_manager: ^0.4.3  # 无边框弹层窗口
  screen_retriever: ^0.2.0 # 读屏幕尺寸:把弹层夹在可见区域内(贴托盘图标定位用)
  flutter_acrylic: ^1.1.0 # 毛玻璃(macOS vibrancy / Windows acrylic)
  # 注:ffi / shared_preferences 由 quota_pulse_ui 传递依赖,无需在此重复声明

dev_dependencies:
  flutter_lints: ^4.0.0

# shared_preferences_foundation 2.6.x 的 pigeon 生成代码用了参数列表尾随逗号(Swift 6.1+ / Xcode 16.3+),
# macos-14 runner 的默认 Xcode 编不过("unexpected ',' separator")。仓库未提交 pubspec.lock,
# CI 每次重新解析会自动升级,故钉在最后一个可编译版本;runner 升到 Xcode 16.3+ 后可移除。
dependency_overrides:
  shared_preferences_foundation: 2.5.7

flutter:
  uses-material-design: true
  # macOS 用系统 SF Pro(字重齐全),不打包 MiSans —— 故此处不声明字体。
  assets:
    - assets/tray_icon.png
