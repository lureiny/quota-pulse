name: quota_pulse
description: "sub2api 用量脉搏 — macOS 菜单栏预览栏"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  quota_pulse_ui:         # 共享层:模型 / UI / 状态 / 桌面 FFI 桥
    path: ../../ui
  tray_manager: ^0.5.0    # 菜单栏状态项(setIcon/setTitle/contextMenu)
  window_manager: ^0.4.3  # 无边框弹层窗口
  flutter_acrylic: ^1.1.0 # 毛玻璃(macOS vibrancy / Windows acrylic)
  # 注:ffi / shared_preferences 由 quota_pulse_ui 传递依赖,无需在此重复声明

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # MiSans 字体文件随共享包发布(ui/lib/fonts/),这里通过 packages/ 前缀引用并打包。
  # 雅黑缺 Medium/Semibold 字重,自带字体保证 Win/macOS 字重渲染一致。
  fonts:
    - family: MiSans
      fonts:
        - asset: packages/quota_pulse_ui/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: packages/quota_pulse_ui/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: packages/quota_pulse_ui/fonts/MiSans-Bold.ttf
          weight: 700
  assets:
    - assets/tray_icon.png
