name: quota_pulse_ui
description: "quota-pulse 跨平台共享层:通用模型 / UI 组件 / 状态 / 桌面 FFI 桥(平台无关)。各 apps/<platform> 依赖本包,只各自实现薄外壳(托盘/窗口/打包)。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0                  # dart:ffi 辅助(native_core)
  shared_preferences: ^2.2.0  # 设置持久化(settings_store)
  system_theme: ^3.3.0        # 读系统强调色(跟随系统 accent)
  url_launcher: ^6.3.0        # 系统默认浏览器打开实例后台(macOS=NSWorkspace / Windows=ShellExecute)
  local_notifier: ^0.1.5      # 用量超阈值系统通知(macOS=NSUserNotification / Windows=SnoreToast)
  yaml: ^3.1.2                # 配置导入:解析 YAML(config_io)
  json2yaml: ^3.0.1           # 配置导出:Map → YAML 字符串(config_io)
  file_selector: ^1.0.3       # 配置导入/导出文件对话框(file_selector_macos/_windows 随之 endorsed)

dev_dependencies:
  flutter_lints: ^4.0.0

# MiSans 字体文件随包放在 lib/fonts/(小米,免费商用,版权见 lib/fonts/MiSans-LICENSE.txt)。
# 仅 apps/windows 的 pubspec 通过 packages/quota_pulse_ui/fonts/... 声明并打包它,修正
# 雅黑缺失的中间字重;macOS 用系统 SF Pro,不打包。本包不重复声明(跨包字体由 app 声明)。
