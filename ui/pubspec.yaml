name: quota_pulse_ui
description: "quota-pulse 跨平台共享层:通用模型 / UI 组件 / 状态 / 桌面 FFI 桥(平台无关)。各 apps/<platform> 依赖本包,只各自实现薄外壳(托盘/窗口/打包)。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0                  # dart:ffi 辅助(native_core)
  shared_preferences: ^2.2.0  # 设置持久化(settings_store)
  system_theme: ^3.3.0        # 读系统强调色(跟随系统 accent)

dev_dependencies:
  flutter_lints: ^4.0.0

# MiSans 字体文件随包放在 lib/fonts/(小米,免费商用,版权见 lib/fonts/MiSans-LICENSE.txt)。
# 字体由各 apps/<platform> 的 pubspec 通过 packages/quota_pulse_ui/fonts/... 声明并打包
# (Flutter 跨包字体的标准做法:packages/<包>/ 前缀解析到 <包>/lib/)。本包不重复声明。
